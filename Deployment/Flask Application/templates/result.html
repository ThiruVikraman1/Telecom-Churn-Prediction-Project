<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction Result - Telecom Churn</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --page-bg: #e2e8f0;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #475569;
            
            /* High Risk Theme */
            --churn-grad: linear-gradient(135deg, #be123c 0%, #f43f5e 100%);
            --churn-border: #fecdd3;
            --churn-accent: #e11d48;
            
            /* Low Risk Theme */
            --retain-grad: linear-gradient(135deg, #047857 0%, #10b981 100%);
            --retain-border: #a7f3d0;
            --retain-accent: #059669;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            min-height: 100vh;
            background: var(--page-bg);
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.15) 0px, transparent 50%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            color: var(--text-main);
        }

        .result-card {
            width: 100%;
            max-width: 520px;
            background: var(--card-bg);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.18), 0 0 0 1px rgba(15, 23, 42, 0.05);
            text-align: center;
        }

        .result-header {
            padding: 2.5rem 2rem;
            color: #ffffff;
        }

        .header-churn {
            background: var(--churn-grad);
        }

        .header-retain {
            background: var(--retain-grad);
        }

        .status-badge {
            display: inline-block;
            padding: 0.35rem 0.9rem;
            background: rgba(255, 255, 255, 0.22);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-bottom: 1rem;
        }

        .status-icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 1rem auto;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            font-weight: 800;
        }

        .result-header h1 {
            font-size: 1.7rem;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .result-body {
            padding: 2.25rem 2rem;
        }

        .prediction-panel {
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        .prediction-panel p {
            font-size: 1.15rem;
            font-weight: 700;
            color: #1e293b;
            line-height: 1.4;
        }

        .btn-return {
            display: block;
            width: 100%;
            padding: 1rem;
            background: #0f172a;
            color: #ffffff;
            text-decoration: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            transition: all 0.15s ease;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.2);
        }

        .btn-return:hover {
            background: #1e293b;
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(15, 23, 42, 0.3);
        }
    </style>
</head>
<body>
    <div class="result-card">
        {% if "churn" in prediction.lower() %}
            <div class="result-header header-churn">
                <div class="status-icon">!</div>
                <span class="status-badge">Action Recommended</span>
                <h1>High Churn Risk</h1>
            </div>
        {% else %}
            <div class="result-header header-retain">
                <div class="status-icon">✓</div>
                <span class="status-badge">Healthy Account</span>
                <h1>Customer Retained</h1>
            </div>
        {% endif %}

        <div class="result-body">
            <div class="prediction-panel">
                <p>{{ prediction }}</p>
            </div>
            <a href="/" class="btn-return">← Analyze Another Customer</a>
        </div>
    </div>
</body>
</html>
